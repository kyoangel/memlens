<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f48"/><stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#7cf29c"/><stop offset="0.55" stop-color="#34C759"/><stop offset="1" stop-color="#1c8f3c"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <g filter="url(#shadow)">
    <rect x="312" y="312" width="400" height="400" rx="80" fill="none" stroke="#f4f6f8" stroke-width="56"/>
    <g stroke="#f4f6f8" stroke-width="48" stroke-linecap="round">
      <line x1="432" y1="232" x2="432" y2="312"/><line x1="592" y1="232" x2="592" y2="312"/>
      <line x1="432" y1="712" x2="432" y2="792"/><line x1="592" y1="712" x2="592" y2="792"/>
      <line x1="232" y1="432" x2="312" y2="432"/><line x1="232" y1="592" x2="312" y2="592"/>
      <line x1="712" y1="432" x2="792" y2="432"/><line x1="712" y1="592" x2="792" y2="592"/>
    </g>
  </g>
  <circle cx="512" cy="512" r="120" fill="#34C759" opacity="0.55" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="104" fill="url(#lens)"/>
  <circle cx="548" cy="476" r="28" fill="#ffffff" fill-opacity="0.85"/>
</svg>
